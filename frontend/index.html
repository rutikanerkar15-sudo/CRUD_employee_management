<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Employee Management System</h1>

    <!-- Form for Add / Edit -->
    <div class="card">
      <h2 id="form-title">Add New Employee</h2>
      <form id="emp-form">
        <input type="hidden" id="emp-id">
        
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="text" id="department" placeholder="Department" required>
        <input type="text" id="role" placeholder="Role" required>
        <input type="number" id="salary" placeholder="Salary ($)" step="0.01" required>
        <input type="date" id="join_date" required>
        
        <div class="form-actions">
          <button type="submit" id="save-btn">Save Employee</button>
          <button type="button" id="cancel-btn" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Employee Table Section with Search -->
    <div class="card">
      <h2>Employee List</h2>
      
      <!-- Search Input Box -->
      <div style="margin-bottom: 15px;">
        <input type="text" id="search-input" placeholder="🔍 Search by name or department..." onkeyup="filterEmployees()">
      </div>

      <table>
        <thead>
          <tr>
            <th onclick="sortTable(0)" style="cursor:pointer;">Name ⇅</th>
            <th>Email</th>
            <th onclick="sortTable(2)" style="cursor:pointer;">Department ⇅</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Join Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employee-tbody">
          <!-- Populated dynamically by JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
